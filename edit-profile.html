<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chỉnh Sửa Trang Cá Nhân - NomNom</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-left">
        <a href="index.html" class="link-no-decor">
          <div class="logo">Nom<span>Nom</span></div>
        </a>
      </div>
      <div class="header-right">
        <a href="index.html" class="btn-login btn-nav-back">
          <i class="fas fa-arrow-left"></i> Quay lại
        </a>
      </div>
    </header>

    <div class="app-layout layout-center">
      <main class="main-content-area profile-card">
        
        <h2 class="profile-header-title">
          <i class="fas fa-user-edit icon-primary"></i> Chỉnh sửa trang cá nhân
        </h2>

        <div id="profileLoading" class="empty-state">
          <i class="fas fa-spinner fa-spin"></i>
          <h2>Đang tải thông tin cá nhân...</h2>
        </div>

        <!-- Bỏ class is-hidden để JS điều khiển display bằng style.display -->
        <form id="editProfileForm" class="edit-profile-form" style="display: none;">
          
          <div class="avatar-upload-section">
            <div class="avatar-wrapper">
              <img id="avatarPreview" src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Avatar" class="avatar-preview-img" />
            </div>
            
            <div class="avatar-btn-container">
              <label for="avatarFileInput" class="btn-login btn-select-file">
                <i class="fas fa-camera"></i> Chọn ảnh mới từ máy
              </label>
              <input type="file" id="avatarFileInput" accept="image/*" class="is-hidden" />
            </div>
            
            <div id="uploadStatus" class="upload-status"></div>

            <div class="url-input-container">
              <label for="editAvatarUrl" class="label-sm">Hoặc nhập Link Ảnh (URL)</label>
              <input type="url" id="editAvatarUrl" placeholder="https://example.com/avatar.jpg" class="input-url" />
            </div>
          </div>

          <div class="form-group">
            <label for="editDisplayName" class="input-label">Tên hiển thị <span class="required-asterisk">*</span></label>
            <input type="text" id="editDisplayName" required class="form-control" placeholder="Nhập tên của bạn..." />
          </div>

          <div class="form-actions">
            <a href="index.html" class="btn-login btn-cancel">Hủy</a>
            <button type="submit" id="btnSaveProfile" class="btn-add-post btn-save">
              <i class="fas fa-save"></i> Lưu thay đổi
            </button>
          </div>

        </form>
      </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="edit-profile.js"></script>
  </body>
</html>
