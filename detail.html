<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Món Ăn - NomNom</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <header class="main-header">
        <div class="header-left">
            <div class="logo" id="logoBtn" onclick="window.location.href='index.html'">Nom<span>Nom</span></div>
        </div>
        <div class="header-right">
            <button class="btn-login" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </button>
        </div>
    </header>

    <div class="detail-container">
        <div class="detail-card">
            <div id="viewPostDetailArea">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin spinner-icon"></i>
                    <p>Đang tải chi tiết món ăn ngon...</p>
                </div>
            </div>

            <hr class="divider">

            <h4 class="comments-title">
                <i class="far fa-comments"></i> Bình luận (<span id="commentCount">0</span>)
            </h4>
            
            <div id="commentsList" class="comments-list"></div>

            <div id="commentAuthWarning" class="auth-warning is-hidden">
                Bạn cần <a href="login.html" class="login-link">Đăng nhập</a> để viết bình luận.
            </div>

            <form id="commentForm" class="comment-form is-hidden">
                <input type="hidden" id="editingCommentId" value="" />
                <input type="text" id="commentInput" required placeholder="Viết bình luận của bạn..." class="comment-input" />
                <button type="submit" id="submitCommentBtn" class="btn-submit-comment">Gửi</button>
                <button type="button" id="cancelEditCommentBtn" class="btn-cancel-comment is-hidden">Hủy</button>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="detail.js"></script>
</body>
</html>
