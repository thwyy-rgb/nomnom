<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Món Ăn - NomNom</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <header class="main-header">
        <div class="header-left">
            <div class="logo" id="logoBtn" onclick="window.location.href='index.html'">Nom<span>Nom</span></div>
        </div>
        <div class="header-right">
            <button class="btn-login" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </button>
        </div>
    </header>

    <div class="detail-container">
        <div class="detail-card">
            <div id="viewPostDetailArea">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin spinner-icon"></i>
                    <p>Đang tải chi tiết món ăn ngon...</p>
                </div>
            </div>

            <hr class="divider" style="margin: 30px 0; border: none; border-top: 1px solid #eee;">

            <section class="comments-section">
                <h4 class="comments-title" style="font-size: 18px; font-weight: 700; color: #2d3436; margin-bottom: 20px;">
                    <i class="far fa-comments"></i> Bình luận (<span id="commentCount">0</span>)
                </h4>
                
                <div id="commentAuthWarning" style="display: none; background: #fff3cd; color: #856404; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border: 1px solid #ffeeba;">
                    Bạn cần <a href="login.html" style="color: #e67e22; font-weight: 700; text-decoration: underline;">Đăng nhập</a> để viết bình luận.
                </div>

                <form id="commentForm" style="display: none; gap: 12px; align-items: flex-start; margin-bottom: 25px;">
                    <img id="currentUserAvatar" src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                        <input type="hidden" id="editingCommentId" value="" />
                        <input type="text" id="commentInput" required placeholder="Viết bình luận của bạn..." style="width: 100%; padding: 12px 16px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;" />
                        <div style="display: flex; gap: 8px; justify-content: flex-end;">
                            <button type="button" id="cancelEditCommentBtn" style="display: none; padding: 8px 16px; background: #718093; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">Hủy</button>
                            <button type="submit" id="submitCommentBtn" style="padding: 8px 20px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">Gửi</button>
                        </div>
                    </div>
                </form>

                <div id="commentsList" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </section>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="detail.js"></script>
</body>
</html>
