<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NomNom - Chi Tiết Bài Viết</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f1f2f6;">

  <header class="main-header">
    <div class="header-left">
      <div class="logo" onclick="window.location.href='main.html'">Nom<span>Nom</span></div>
    </div>
    <div class="header-right">
      <a href="main.html" class="btn-login" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-arrow-left"></i> Quay lại khám phá
      </a>
    </div>
  </header>

  <main style="padding: 20px;">
    <article class="article-wrapper">
      <div class="article-header">
        <h1 id="articleTitle" style="font-size: 36px; line-height: 1.3; font-weight: 800; color: #1e272e; margin-bottom: 12px;">Đang tải tiêu đề...</h1>
        <p id="articleSummary" style="font-size: 18px; color: #57606f; line-height: 1.5;">Đang tải tóm tắt bài viết...</p>
        
        <div class="article-meta">
          <img id="articleAuthorAvatar" src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Avatar">
          <div class="article-meta-info">
            <span id="articleAuthorName" class="author">Tác giả</span>
            <span id="articleDate" class="date">01/01/2026</span>
          </div>
        </div>
      </div>

      <img id="articleHeroImage" class="article-hero-thumb" src="" alt="Thumbnail" style="display: none;">

      <!-- Vùng render động toàn bộ block nội dung soạn thảo -->
      <div id="articleContent"></div>
    </article>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQCed1Led55t9s8deU1BZSpkVe1oSt-oU",
      authDomain: "nomnom-42f0b.firebaseapp.com",
      projectId: "nomnom-42f0b",
      storageBucket: "nomnom-42f0b.firebasestorage.app",
      messagingSenderId: "1011885827413",
      appId: "1:1011885827413:web:56a91e6298d8f219dc7bdc",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadArticle() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        alert("Không tìm thấy bài viết!");
        window.location.href = "main.html";
        return;
      }

      try {
        const docRef = doc(db, "posts", postId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const post = docSnap.data();
          renderArticle(post);
        } else {
          document.getElementById('articleContent').innerHTML = `<h3>Bài viết này không tồn tại.</h3>`;
        }
      } catch (error) {
        console.error(error);
      }
    }

    function renderArticle(post) {
      document.getElementById('articleTitle').innerText = post.title;
      document.getElementById('articleSummary').innerText = post.summary;
      document.getElementById('articleAuthorName').innerText = post.author?.displayName || "Thành viên";
      document.getElementById('articleAuthorAvatar').src = post.author?.photoURL || "https://cdn-icons-png.flaticon.com/512/3177/3177440.png";
      document.getElementById('articleDate').innerText = new Date(post.createdAt).toLocaleDateString('vi-VN');

      if (post.thumbnail) {
        const hero = document.getElementById('articleHeroImage');
        hero.src = post.thumbnail;
        hero.style.display = 'block';
      }

      const contentContainer = document.getElementById('articleContent');
      contentContainer.innerHTML = '';

      // Vòng lặp kết xuất từng Block dữ liệu
      post.blocks.forEach(block => {
        const element = createHtmlFromBlock(block);
        if (element) {
          contentContainer.appendChild(element);
        }
      });
    }

    function createHtmlFromBlock(block) {
      const wrapper = document.createElement('div');
      wrapper.className = `content-block block-${block.type}`;

      switch(block.type) {
        case 'heading':
          const heading = document.createElement('h2');
          heading.innerText = block.data.text;
          wrapper.appendChild(heading);
          break;
        case 'paragraph':
          const p = document.createElement('p');
          p.innerText = block.data.text;
          wrapper.appendChild(p);
          break;
        case 'image':
          const figure = document.createElement('figure');
          const img = document.createElement('img');
          img.src = block.data.url;
          figure.appendChild(img);
          if (block.data.caption) {
            const cap = document.createElement('figcaption');
            cap.innerText = block.data.caption;
            figure.appendChild(cap);
          }
          wrapper.appendChild(figure);
          break;
        case 'quote':
          const bq = document.createElement('blockquote');
          const txt = document.createElement('p');
          txt.innerText = `“${block.data.text}”`;
          bq.appendChild(txt);
          if (block.data.caption) {
            const src = document.createElement('cite');
            src.innerText = `— ${block.data.caption}`;
            bq.appendChild(src);
          }
          wrapper.appendChild(bq);
          break;
        case 'divider':
          wrapper.appendChild(document.createElement('hr'));
          break;
        default:
          return null;
      }
      return wrapper;
    }

    window.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>
</html>
