<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NomNom - Chi Tiết Bài Viết</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-alt">

  <header class="main-header">
    <div class="header-left">
      <div class="logo" onclick="window.location.href='main.html'">Nom<span>Nom</span></div>
    </div>
    <div class="header-right">
      <a href="main.html" class="btn-login btn-nav-back">
        <i class="fas fa-arrow-left"></i> Quay lại khám phá
      </a>
    </div>
  </header>

  <main class="article-main-container">
    <article class="article-wrapper">
      <div class="article-header">
        <h1 id="articleTitle" class="article-title">Đang tải tiêu đề...</h1>
        <p id="articleSummary" class="article-summary">Đang tải tóm tắt bài viết...</p>
        
        <div class="article-meta">
          <img id="articleAuthorAvatar" src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Avatar">
          <div class="article-meta-info">
            <span id="articleAuthorName" class="author">Tác giả</span>
            <span id="articleDate" class="date">01/01/2026</span>
          </div>
        </div>
      </div>

      <img id="articleHeroImage" class="article-hero-thumb is-hidden" src="" alt="Thumbnail">
      <div id="articleContent"></div>
    </article>
  </main>
  
  <script type="module" src="article.js"></script>
</body>
</html>
